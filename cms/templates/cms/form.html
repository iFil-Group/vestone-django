{% extends "cms/base_panel.html" %}

{% block panel_content %}
<div class="cms-toolbar">
    <a href="{{ back_url }}" class="cms-btn cms-btn--ghost">Wróć</a>
</div>

<form method="post" enctype="multipart/form-data" class="cms-form">
    {% csrf_token %}
    {% for field in form %}
    {% include "cms/partials/field.html" with field=field %}
    {% endfor %}
    <button type="submit" class="cms-btn cms-btn--primary">Zapisz</button>
</form>
{% endblock %}
