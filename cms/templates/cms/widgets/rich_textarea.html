<div class="cms-richtext{% if widget.compact %} cms-richtext--compact{% endif %}" data-richtext>
    <div class="cms-richtext__toolbar" role="toolbar" aria-label="Formatowanie tekstu">
        <button type="button" data-command="bold" title="Pogrubienie"><strong>B</strong></button>
        <button type="button" data-command="italic" title="Kursywa"><em>I</em></button>
        {% if not widget.compact %}
        <label class="cms-richtext__block">
            <span class="visually-hidden">Styl akapitu</span>
            <select data-heading-select aria-label="Styl akapitu">
                <option value="p">Paragraf</option>
                <option value="h1">Nagłówek 1</option>
                <option value="h2">Nagłówek 2</option>
                <option value="h3">Nagłówek 3</option>
                <option value="h4">Nagłówek 4</option>
                <option value="h5">Nagłówek 5</option>
                <option value="h6">Nagłówek 6</option>
            </select>
        </label>
        <button type="button" data-command="superscript" title="Indeks górny">x²</button>
        <button type="button" data-command="underline" title="Podkreślenie"><u>U</u></button>
        <button type="button" data-command="insertUnorderedList" title="Lista punktowana">• Lista</button>
        <button type="button" data-command="insertOrderedList" title="Lista numerowana">1. Lista</button>
        <button type="button" data-command="createLink" title="Dodaj link">Link</button>
        <button type="button" data-command="unlink" title="Usuń link">Usuń link</button>
        <button type="button" data-command="nbsp" title="Wstaw twardą spację">Twarda spacja</button>
        {% endif %}
        <button type="button" data-command="removeFormat" title="Wyczyść formatowanie">Wyczyść</button>
    </div>
    <div class="cms-richtext__editor" contenteditable="true" role="textbox" aria-multiline="true"></div>
    {% if widget.compact %}
    <p class="cms-field__help">Pogrubienie i kursywa. Pole może zostać puste.</p>
    {% else %}
    <p class="cms-field__help">Pogrubienie, kursywa, indeks górny i nagłówki. Pole może zostać puste. Tekst z Worda przejmuje styl strony.</p>
    {% endif %}
    {% include "django/forms/widgets/textarea.html" %}
</div>
