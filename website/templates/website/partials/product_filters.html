<div class="product-filters" data-product-filters>
    <div class="product-filters__pattern" aria-hidden="true"></div>

    <div class="product-filters__inner">
        <div class="product-filters__head">
            <div class="product-filters__intro">
                {% include "website/partials/breadcrumbs.html" %}
                <h1 class="product-filters__title">
                    {% if page_heading %}{{ page_heading }}{% elif category %}{{ category.title }}{% endif %}
                </h1>
            </div>

            <div class="product-filters__actions">
                <label class="product-filters__search">
                    <span class="visually-hidden">Szukaj produktów</span>
                    <svg class="product-filters__search-icon" width="18" height="18" viewBox="0 0 20 20" aria-hidden="true">
                        <circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.75"/>
                        <path d="M13 13l4 4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
                    </svg>
                    <input
                        type="search"
                        class="product-filters__search-input"
                        placeholder="Szukaj po nazwie…"
                        data-product-search
                        autocomplete="off"
                    >
                </label>
                <button type="button" class="product-filters__reset" data-product-filters-reset hidden>
                    Wyczyść filtry
                </button>
            </div>
        </div>

        <div class="product-filters__grid" role="group" aria-label="Filtry produktów">
            {% for field in product_filters %}
            <label class="product-filters__field">
                <span class="product-filters__label">{{ field.label }}</span>
                <span class="product-filters__control">
                    <select class="product-filters__select" name="{{ field.name }}" data-product-filter>
                        {% for option in field.options %}
                        <option value="{{ forloop.counter0 }}">{{ option }}</option>
                        {% endfor %}
                    </select>
                </span>
            </label>
            {% endfor %}
        </div>
    </div>
</div>
