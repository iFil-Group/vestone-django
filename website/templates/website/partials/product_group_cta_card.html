<a href="{{ products_cta.button_url|default:'/#kontakt' }}" class="product-card product-card--cta">
    <span class="product-card__cta-inner">
        <span class="product-card__cta-title">{{ products_cta.title|default:"Nie wiesz co wybrać?" }}</span>
        <span class="product-card__cta-text rich-text">{{ products_cta.body|safe }}</span>
        <span class="product-card__cta-link">{{ products_cta.button_label|default:"Skontaktuj się" }}</span>
    </span>
</a>
