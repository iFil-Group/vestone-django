<article class="tip-card">
    <a href="{{ detail_url_prefix|default:'/porady' }}/{{ tip.slug }}/" class="tip-card__link">
        <span class="tip-card__media">
            <img src="{{ placeholder_img }}" alt="" loading="lazy" width="400" height="260">
        </span>
        <span class="tip-card__body">
            <time class="tip-card__date" datetime="{{ tip.date }}">{{ tip.date_display }}</time>
            <h2 class="tip-card__title">{{ tip.title }}</h2>
            <p class="tip-card__excerpt">{{ tip.excerpt }}</p>
            <span class="tip-card__more">Czytaj więcej</span>
        </span>
    </a>
</article>
