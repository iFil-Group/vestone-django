{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Panel CMS — Vestone{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'theme/css/cms.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body class="cms-body">
    <main class="cms-main">
        {% block content %}{% endblock %}
    </main>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
