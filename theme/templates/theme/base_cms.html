{% load static %}
<!DOCTYPE html>
<html lang="pl" class="cms-html--panel">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Panel CMS — Vestone{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'theme/css/cms.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body class="cms-body {% block body_class %}{% endblock %}">
    {% block body %}{% endblock %}
    <script src="{% static 'theme/js/cms-richtext.js' %}" defer></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
